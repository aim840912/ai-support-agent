<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Indigo background -->
  <rect width="32" height="32" rx="7" fill="hsl(239, 84%, 67%)"/>

  <!-- Antenna ball -->
  <circle cx="16" cy="4.5" r="2" fill="white"/>
  <!-- Antenna stem -->
  <line x1="16" y1="6.5" x2="16" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Bot head -->
  <rect x="7" y="10" width="18" height="13" rx="3" fill="none" stroke="white" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="12.5" cy="16" r="2" fill="white"/>
  <circle cx="19.5" cy="16" r="2" fill="white"/>

  <!-- Mouth -->
  <line x1="12" y1="21" x2="20" y2="21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
